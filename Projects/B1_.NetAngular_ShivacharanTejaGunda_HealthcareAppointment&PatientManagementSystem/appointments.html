<!DOCTYPE html>
<html>
<head>
<title>Appointments</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/styles.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
<nav class="navbar navbar-dark bg-primary mb-3">
<div class="container">
<a class="navbar-brand" href="index.html">Healthcare System</a>
</div>
</nav>
<div class="container mt-4">
<a href="index.html" class="btn btn-secondary mb-3">Dashboard</a>
<div class="p-4">
<div class="banner mb-4">
<h2>Appointment Management</h2>
<p>Manage bookings, schedules and patient visits efficiently</p>
</div>
<!-------------------- ACTIONS + FILTERS----------------------->
<div class="row mb-4 align-items-end">
<!-- -------------------------Buttons -------------------------->
<div class="col-md-6 d-flex gap-2 flex-wrap">
<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#appointmentModal">
Book Appointment
</button>
<button class="btn btn-danger"
onclick="clearAllAppointments()">
🗑 Clear All
</button>
<button class="btn btn-secondary"
onclick="applyFilters()">
🔍 Apply Filters
</button>
</div>
<!------------------- Filters ----------------------->
<div class="col-md-6 d-flex gap-2">
<select id="filterStatus" class="form-select">
<option value="">All Status</option>
<option>Booked</option>
<option>Completed</option>
<option>Cancelled</option>
</select>
<input type="date"
id="filterDate"
class="form-control">
</div>
</div>

<!--------------------------- TABLE ---------------------------->
<div class="table-responsive">
<table class="table table-hover table-striped shadow-sm">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Patient</th>
<th>Doctor</th>
<th>Date</th>
<th>Time Slot</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="appointmentTable"></tbody>
</table>
</div> <!-- CARD END -->
</div><!-- CONTAINER END -->
</div> 
<!--------------------------------- Appointment Modal --------------------->
<div class="modal fade" id="appointmentModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Book Appointment</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<select id="patientDropdown"
class="form-control mb-2"></select>
<select id="doctorDropdown"
class="form-control mb-2"></select>
<select id="duration" class="form-control mb-2">
<option value="1">1 Hour</option>
<option value="2">2 Hours</option>
</select>
<input type="date"
id="date"
class="form-control mb-2">
<select id="appointmentSlot"
class="form-control mb-2"></select>
<select id="status"
class="form-control mb-2">
<option>Booked</option>
<option>Completed</option>
<option>Cancelled</option>
</select>
</div>
<div class="modal-footer">
<button id="bookBtn" class="btn btn-success"
onclick="bookAppointment()">
Save
</button>
</div>
</div>
</div>
</div>
<script src="js/data.js"></script>
<script src="js/appointments.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!------------------------ Toast ------------------------------>
<div class="toast position-fixed bottom-0 end-0 p-3" id="toastMsg">
<div class="toast-body bg-success text-white"></div>
</div>
</body>
</html>
