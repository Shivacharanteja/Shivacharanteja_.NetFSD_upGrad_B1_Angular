<!DOCTYPE html>
<html>
<head>
<title>Patients</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/styles.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
<!------------------------------- NAVBAR ADDED ----------------------->
<nav class="navbar navbar-dark bg-primary mb-3">
<div class="container">
  <a class="navbar-brand" href="index.html">Healthcare System</a>
</div>
</nav>
<div class="container mt-4">
<a href="index.html" class="btn btn-secondary mb-3">Dashboard</a>
<div class="banner mb-4">
  <h2>Patient Management</h2>
  <p>Manage patient records and details</p>
</div>
<button class="btn btn-primary mb-3"
data-bs-toggle="modal"
data-bs-target="#patientModal">
Add Patient
</button>
<input type="text"
id="searchPatient"
class="form-control mb-3"
placeholder="Search by name or phone">
<div class="table-responsive">
<table class="table table-hover table-striped shadow-sm">
<thead class="table-dark">
<tr>
<th>Patient ID</th>
<th>Name</th>
<th>Age</th>
<th>Gender</th>
<th>Phone</th>
<th>Email</th>
<th>Notes</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="patientTable"></tbody>
</table>
</div>
</div>

<!-------------------------- Modal --------------------------->
<div class="modal fade" id="patientModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5>Patient Form</h5>
</div>
<div class="modal-body">
<input type="hidden" id="patientId">
<input class="form-control mb-2" id="name" placeholder="Name">
<input class="form-control mb-2" id="age" placeholder="Age">
<select class="form-control mb-2" id="gender">
<option>Male</option>
<option>Female</option>
</select>
<input class="form-control mb-2" id="phone" placeholder="Phone">
<input class="form-control mb-2" id="email" placeholder="Email">
<textarea class="form-control" id="notes" placeholder="Medical Notes"></textarea>
</div>
<div class="modal-footer">
<button class="btn btn-success" onclick="savePatient()">Save</button>
</div>
</div>
</div>
</div>
<script src="js/data.js"></script>
<script src="js/patients.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Toast -->
<div class="toast position-fixed bottom-0 end-0 p-3" id="toastMsg">
  <div class="toast-body bg-success text-white"></div>
</div>
</body>
</html>
